name: ripple
version: 0.1.0
description: "Keeps Hermes work consistent when facts change: update a source value and every quote, report or check built on it turns stale, its approval is revoked, and publishing the old version is refused until it is rebuilt and re-approved by a human."
author: sprmn24
provides_tools:
  - ripple_put_source
  - ripple_derive
  - ripple_impact
  - ripple_rebuild
  - ripple_publish
  - ripple_graph
provides_hooks:
  - pre_tool_call
